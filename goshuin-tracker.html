<meta name="theme-color" content="#2c4a6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="御朱印帳">
<meta name="mobile-web-app-capable" content="yes">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Zen+Old+Mincho:wght@400;600&display=swap');

  :root{
    --washi:#f0ede3;
    --washi-deep:#e2dccb;
    --sumi:#242a2e;
    --sumi-soft:#454e52;
    --shu:#2c4a6e;       /* 藍染 - indigo dye */
    --shu-deep:#1f3650;
    --shu-glow:#3d6690;
    --gold:#7d8f6a;
    --line:#c3c4b4;
    --paper-shadow: rgba(30,40,50,0.18);
    --card:#f7f4ea;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(44,74,110,0.05), transparent 45%),
      radial-gradient(ellipse at bottom right, rgba(156,123,63,0.06), transparent 50%),
      var(--washi);
    background-attachment:fixed;
    color:var(--sumi);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    position:relative;
  }
  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.008) 3px),
      repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.008) 3px);
    pointer-events:none;
    z-index:0;
  }

  .app{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:0 28px 100px;}

  /* ============ HEADER ============ */
  header.hero{
    display:flex; align-items:center; justify-content:space-between;
    padding:48px 4px 34px;
    border-bottom:1px solid var(--line);
    margin-bottom:36px;
    gap:24px;
  }
  .hero-title-block{display:flex; align-items:flex-end; gap:22px;}
  .kanji-vert{
    writing-mode: vertical-rl;
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:2.1rem;
    letter-spacing:0.28em;
    color:var(--sumi);
    line-height:1.15;
  }
  .hero-en{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.68rem;
    letter-spacing:0.32em;
    color:var(--sumi-soft);
    text-transform:uppercase;
    margin-top:6px;
  }
  .hero-sub{
    font-size:0.92rem;
    color:var(--sumi-soft);
    line-height:1.9;
    max-width:260px;
    border-left:1px solid var(--line);
    padding-left:18px;
  }

  .hero-scene{
    flex-shrink:0;
    width:200px;
    max-width:38vw;
  }
  .hero-scene svg{width:100%; height:auto; display:block;}

  /* ============ BACKUP BAR ============ */
  .backup-bar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    margin-bottom:24px;
  }
  .backup-hint{
    font-size:0.72rem; color:var(--sumi-soft); opacity:0.75;
  }
  .share-card-preview-wrap{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    padding:12px;
    display:flex;
    justify-content:center;
  }
  #shareCanvas{width:100%; max-width:340px; height:auto; display:block; border-radius:2px;}

  /* ============ PHOTO CROP TOOL ============ */
  .crop-hint{font-size:0.78rem; color:var(--sumi-soft); margin-bottom:12px;}
  #cropStage{
    position:relative;
    max-width:100%;
    max-height:60vh;
    overflow:hidden;
    background:#1c1a17;
    display:flex; align-items:center; justify-content:center;
    border-radius:2px;
    touch-action:none;
    user-select:none;
  }
  #cropImage{
    display:block;
    max-width:100%;
    max-height:60vh;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  #cropBox{
    position:absolute;
    border:2px solid var(--shu);
    box-shadow:0 0 0 2000px rgba(0,0,0,0.55);
    cursor:move;
    touch-action:none;
  }
  .crop-handle{
    position:absolute;
    width:20px; height:20px;
    margin:-10px;
    touch-action:none;
  }
  .crop-handle::after{
    content:'';
    position:absolute; top:6px; left:6px;
    width:8px; height:8px;
    background:var(--shu);
    border:1.5px solid #faf3e4;
    border-radius:50%;
  }
  .crop-handle[data-handle="nw"]{top:0; left:0; cursor:nwse-resize;}
  .crop-handle[data-handle="ne"]{top:0; right:0; left:auto; cursor:nesw-resize;}
  .crop-handle[data-handle="sw"]{bottom:0; left:0; top:auto; cursor:nesw-resize;}
  .crop-handle[data-handle="se"]{bottom:0; right:0; top:auto; left:auto; cursor:nwse-resize;}

  /* ============ STATS STRIP ============ */
  section.stats { }
  .stats{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:32px;
  }
  .stat{
    background:var(--washi);
    padding:20px 22px;
    display:flex; flex-direction:column; gap:6px;
  }
  .stat-label{font-size:0.68rem; letter-spacing:0.18em; color:var(--sumi-soft); text-transform:uppercase;}
  .stat-value{font-family:'Shippori Mincho', serif; font-size:1.9rem; font-weight:700; color:var(--shu-deep);}
  .stat-value small{font-size:1rem; font-weight:500; color:var(--sumi-soft); margin-left:2px;}

  /* ============ MAP TAB ============ */
  .map-progress{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.8rem;
    color:var(--sumi-soft);
    background:var(--card);
    border:1px solid var(--line);
    padding:6px 14px;
    border-radius:14px;
  }
  .map-progress strong{color:var(--shu-deep); font-weight:700;}
  .map-wrap{
    display:grid;
    grid-template-columns:minmax(300px, 480px) 1fr;
    gap:28px;
    align-items:flex-start;
  }
  .map-svg-col{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    padding:14px 14px 10px;
  }
  #japanMap{width:100%; height:auto; display:block;}
  .pref-tile{cursor:pointer;}
  .tile-base{stroke:var(--washi); stroke-width:2; transition:fill 0.15s ease, fill-opacity 0.15s ease;}
  .pref-tile:hover .tile-base{filter:brightness(1.08);}
  .pref-tile.selected .tile-base{stroke:var(--sumi); stroke-width:2.5;}
  .tile-label{
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:7.5px; font-weight:500;
    text-anchor:middle; dominant-baseline:central; pointer-events:none;
  }
  .pref-shape{cursor:pointer; transition:fill 0.15s ease, fill-opacity 0.15s ease, stroke-width 0.12s ease, filter 0.12s ease;}
  .inset-divider{stroke:var(--sumi-soft); stroke-width:0.6; opacity:0.5;}
  .inset-frame{fill:none; stroke:var(--sumi-soft); stroke-width:0.5; stroke-dasharray:2,1.5; opacity:0.5;}
  .region-label{
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:5.5px; font-weight:700;
    letter-spacing:0.02em; pointer-events:none;
  }
  .selected-pref-label-bg{fill:var(--sumi); opacity:0.88; pointer-events:none;}
  .selected-pref-pin{fill:var(--shu); stroke:#faf3e4; stroke-width:0.4; pointer-events:none;}
  .selected-pref-label-text{
    font-family:'Shippori Mincho', serif; font-size:6px; font-weight:700;
    fill:#faf3e4; pointer-events:none;
  }
  .pref-shape:hover{filter:brightness(1.08);}
  .map-credit{
    font-size:0.64rem; color:var(--sumi-soft); opacity:0.65; text-align:right; margin-top:8px; letter-spacing:0.02em;
  }

  /* ============ TABS ============ */

  }

    font-family:'Zen Old Mincho', serif;
    font-size:1.05rem;

    letter-spacing:0.06em;
    margin:0;

  }
  .section-head h2::before{
    content:'';
    display:inline-block;

  .btn{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.82rem;
    background:var(--shu);
    color:var(--washi);

  .books-scroll{
    display:flex; gap:16px; overflow-x:auto; padding-bottom:14px; margin-bottom:44px;

  .book-card{

  .mangan-badge{
    position:absolute; top:10px; right:10px;

  .book-card > *{position:relative; z-index:1;}
  .book-card .book-title{
    font-family:'Shippori Mincho', serif;
    font-weight:700;

    line-height:1.5;
    writing-mode:vertical-rl;
    flex:1;

    color:#faf3e4;
    text-shadow:0 1px 2px rgba(0,0,0,0.15);

  .book-card .book-meta{
    display:flex; justify-content:space-between; align-items:flex-end;
    color:#faf3e4;
  }
  .book-card .book-meta-col{display:flex; flex-direction:column; gap:2px;}
  .book-card .book-meta-col.right{align-items:flex-end;}
  .book-card .book-count{font-size:1.5rem; font-family:'Shippori Mincho', serif; font-weight:700;}
  .book-card .book-count small{font-size:0.7rem; font-weight:400; opacity:0.85;}
  .book-card .book-tag{font-size:0.66rem; letter-spacing:0.08em; opacity:0.85;}
  .book-card .book-location{font-size:0.62rem; letter-spacing:0.04em; opacity:0.75;}
  .book-card .book-total{font-size:0.68rem; opacity:0.9;}

  .book-add{
    width:100%;
    aspect-ratio: 0.68;
    max-width:220px;

    border-radius:3px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;

    font-size:0.82rem;
    flex-direction:column; gap:8px;
    transition:border-color 0.16s, color 0.16s;
  }
  .book-add:hover{border-color:var(--shu); color:var(--shu-deep);}
  .book-add .plus{font-size:1.8rem; font-weight:300;}

  /* ============ TOOLBAR ============ */
  .toolbar{
    display:flex; flex-wrap:wrap; gap:12px; align-items:center;
    margin-bottom:22px;
  }
  .toolbar input[type="text"], .toolbar select{
    font-family:'Zen Kaku Gothic New', sans-serif;
    background:var(--card);
    border:1px solid var(--line);
    padding:9px 14px;
    font-size:0.85rem;
    color:var(--sumi);
    border-radius:2px;
  }
  .toolbar input[type="text"]{flex:1; min-width:180px;}
  .toolbar input:focus, .toolbar select:focus{outline:none; border-color:var(--shu);}
  .view-toggle{display:flex; border:1px solid var(--line); border-radius:2px; overflow:hidden;}
  .view-toggle button{
    background:var(--card); border:none; padding:9px 14px; cursor:pointer;
    font-size:0.8rem; color:var(--sumi-soft); font-family:'Zen Kaku Gothic New', sans-serif;
    border-left:1px solid var(--line);
  }
  .view-toggle button:first-child{border-left:none;}
  .view-toggle button.active{background:var(--shu); color:var(--washi);}

  /* ============ RECORD GRID ============ */
  .records-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:18px;
    margin-bottom:20px;
  }
  .record-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    overflow:hidden;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    display:flex; flex-direction:column;
  }
  .record-card:hover{transform:translateY(-3px); box-shadow:4px 6px 0 var(--paper-shadow);}
  .record-photo{
    width:100%; aspect-ratio:3/4;
    background:linear-gradient(135deg, #efe4cc, #e3d3ac);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .record-photo img{width:100%; height:100%; object-fit:cover;}
  .record-photo .no-photo-mark{
    font-family:'Shippori Mincho', serif;
    color:var(--shu-deep);
    opacity:0.35;
    font-size:2.6rem;
    writing-mode:vertical-rl;
  }
  .record-info{padding:14px 16px 16px; flex:1; display:flex; flex-direction:column; gap:6px;}
  .record-info .r-name{font-family:'Shippori Mincho', serif; font-weight:700; font-size:1rem; line-height:1.4;}
  .record-info .r-date{font-size:0.74rem; color:var(--sumi-soft); letter-spacing:0.03em;}
  .western-year{font-size:0.9em; opacity:0.75;}
  .record-info .r-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;}
  .tag-pill{
    font-size:0.66rem; padding:3px 9px; border-radius:12px;
    background:rgba(44,74,110,0.08); color:var(--shu-deep);
    border:1px solid rgba(44,74,110,0.18);
    letter-spacing:0.02em;
  }
  .tag-pill.proxy-pill{
    background:rgba(43,38,34,0.08); color:var(--sumi-soft);
    border-color:rgba(43,38,34,0.2);
  }
  .tag-picker{display:flex; flex-wrap:wrap; gap:8px;}
  .tag-option{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.8rem;
    padding:8px 16px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--sumi-soft);
    cursor:pointer;
    transition:all 0.14s ease;
    letter-spacing:0.02em;
  }
  .tag-option:hover{border-color:var(--shu); color:var(--shu-deep);}
  .tag-option.sel{
    background:var(--shu);
    border-color:var(--shu);
    color:var(--washi);
  }
  .r-price{margin-top:auto; padding-top:8px; font-size:0.76rem; color:var(--gold); font-weight:500;}

  /* list view */
  .records-list{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:20px;}
  .list-row{
    background:var(--card);
    display:flex;
    align-items:center;
    gap:16px;
    padding:12px 16px;
    cursor:pointer;
    transition:background 0.12s;
  }
  .list-row:hover{background:#fff8ea;}
  .list-thumb{width:64px; height:82px; flex-shrink:0; background:linear-gradient(135deg,#efe4cc,#e3d3ac); border-radius:2px; overflow:hidden; display:flex; align-items:center; justify-content:center;}
  .list-thumb.landscape{width:104px; height:70px;}
  .list-thumb img{width:100%; height:100%; object-fit:cover;}
  .list-thumb .mini-mark{color:var(--shu-deep); opacity:0.3; font-size:1.5rem; font-family:'Shippori Mincho',serif;}
  .list-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px;}
  .list-name{font-family:'Shippori Mincho', serif; font-weight:600; font-size:0.98rem;}
  .proxy-tag{
    display:inline-block; margin-left:8px; padding:1px 7px;
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:0.62rem; font-weight:500;
    color:var(--sumi-soft); border:1px solid var(--line); border-radius:10px;
    vertical-align:middle;
  }
  .list-meta{display:flex; flex-wrap:wrap; align-items:center; gap:0 10px; font-size:0.78rem; color:var(--sumi-soft);}
  .list-meta .list-price{color:var(--gold); font-weight:500;}
  .list-meta span:not(:last-child)::after{content:'・'; margin-left:10px; color:var(--line); font-weight:400;}
  .list-book{font-size:0.72rem; color:var(--sumi-soft);}


  .empty-state{
    text-align:center; padding:70px 20px; color:var(--sumi-soft);
  }
  .empty-state .mark{font-size:2.4rem; opacity:0.25; margin-bottom:14px; font-family:'Shippori Mincho',serif;}
  .empty-daruma{width:88px; height:88px; margin-bottom:16px; opacity:0.85;}
  .empty-state p{font-size:0.88rem; line-height:1.8;}

  /* ============ MODAL ============ */
  .overlay{
    position:fixed; inset:0; background:rgba(30,22,15,0.55);
    display:none; align-items:flex-start; justify-content:center;
    z-index:100; padding:5vh 20px; overflow-y:auto;
    backdrop-filter:blur(2px);
  }
  .overlay.show{display:flex;}

  .modal{
    background:var(--washi);
    max-width:560px; width:100%;
    border-radius:3px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    position:relative;
    animation:modalIn 0.22s ease;
  }
  @keyframes modalIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
  .modal-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 26px 18px;
    border-bottom:1px solid var(--line);
  }
  .modal-head h3{
    font-family:'Zen Old Mincho', serif; font-size:1.1rem; font-weight:600; margin:0;
  }
  .modal-close{
    background:none; border:none; font-size:1.3rem; color:var(--sumi-soft);
    cursor:pointer; line-height:1; padding:4px;
  }
  .modal-close:hover{color:var(--shu);}
  .modal-body{padding:22px 26px 26px;}
  .field{margin-bottom:16px; display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:0.76rem; color:var(--sumi-soft); letter-spacing:0.03em;}
  .checkbox-field{
    display:flex; align-items:center; gap:8px; cursor:pointer;
    font-size:0.84rem; color:var(--sumi); letter-spacing:0.01em;
  }
  .checkbox-field input[type="checkbox"]{width:16px; height:16px; accent-color:var(--shu); cursor:pointer;}
  .field input[type="text"], .field input[type="date"], .field input[type="number"], .field textarea, .field select{
    font-family:'Zen Kaku Gothic New', sans-serif;
    background:var(--card);
    border:1px solid var(--line);
    padding:10px 12px;
    font-size:0.88rem;
    color:var(--sumi);
    border-radius:2px;
    width:100%;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--shu);}
  .field textarea{resize:vertical; min-height:70px; font-family:'Zen Kaku Gothic New', sans-serif;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .era-date-input{
    display:flex; align-items:center; gap:4px; flex-wrap:wrap;
  }
  .era-date-input .era-prefix{
    font-family:'Shippori Mincho', serif; font-weight:600; font-size:0.88rem; color:var(--sumi); margin-right:2px;
  }
  .era-date-input .era-unit{font-size:0.8rem; color:var(--sumi-soft);}
  .era-date-input input[type="number"]{width:56px; padding:10px 8px; text-align:center;}
  .era-date-input select{padding:10px 6px;}
  .era-western-hint{font-size:0.76rem; color:var(--gold); margin-top:5px;}
  .photo-drop{
    border:1.5px dashed var(--line);
    border-radius:2px;
    padding:22px;
    text-align:center;
    cursor:pointer;
    font-size:0.8rem;
    color:var(--sumi-soft);
    position:relative;
    overflow:hidden;
    min-height:100px;
    display:flex; align-items:center; justify-content:center;
  }
  .photo-drop:hover{border-color:var(--shu);}
  .photo-drop img{max-width:100%; max-height:180px; border-radius:2px;}
  .modal-actions{display:flex; justify-content:space-between; align-items:center; margin-top:22px; gap:10px;}

  /* detail modal */
  .detail-photo{width:100%; max-height:340px; object-fit:contain; background:#e9dcc2; border-radius:2px; margin-bottom:16px;}
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 20px; margin-bottom:16px;}
  .detail-grid div{font-size:0.85rem;}
  .detail-grid .dl{font-size:0.68rem; color:var(--sumi-soft); letter-spacing:0.06em; text-transform:uppercase; margin-bottom:3px;}
  .detail-notes{font-size:0.85rem; line-height:1.8; color:var(--sumi-soft); white-space:pre-wrap; background:var(--card); padding:14px 16px; border-radius:2px; border:1px solid var(--line);}

  /* toast */
  .toast{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--sumi); color:var(--washi); padding:12px 24px; border-radius:2px;
    font-size:0.84rem; opacity:0; pointer-events:none; transition:all 0.25s ease; z-index:200;
    display:flex; align-items:center; gap:10px;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  ::-webkit-scrollbar{height:8px; width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  @media (max-width:640px){
    .map-svg-col{
      margin:0 -28px;
      border-left:none; border-right:none;
      border-radius:0;
      padding-left:10px; padding-right:10px;
    }
    header.hero{
      display:grid;
      grid-template-columns:auto 1fr;
      grid-template-areas:"kanji scene" "text text";
      align-items:start;
      column-gap:16px;
      row-gap:12px;
      padding-top:28px;
    }
    .hero-title-block{display:contents;}
    .kanji-vert{grid-area:kanji;}
    .hero-text-col{grid-area:text;}
    .hero-scene{grid-area:scene; justify-self:end; align-self:center; width:120px; max-width:120px; margin:0;}
    .hero-sub{border-left:none; padding-left:0; border-top:1px solid var(--line); padding-top:12px; margin-top:6px;}
    .stats{grid-template-columns:repeat(2,1fr);}
    .field-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="app">

  <header class="hero">
    <div class="hero-title-block">
      <span class="kanji-vert">神社巡り</span>
      <div class="hero-text-col">
        <div class="hero-en">Goshuin Collection Log</div>
        <div class="hero-sub">記錄每一次參拜、每一枚墨跡與朱印，留下走過的社寺足跡。</div>
      </div>
    </div>
    <div class="hero-scene" aria-hidden="true">
      <svg viewBox="0 0 260 150" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,108 Q30,100 60,108 T120,108 T180,108 T260,108" fill="none" stroke="var(--line)" stroke-width="1.5" opacity="0.5"/>
        <path d="M70,110 L133,26 L196,110 Z" fill="var(--shu)" stroke="var(--shu-deep)" stroke-width="1.6" stroke-linejoin="round"/>

<script>
(function(){

    {code:'35',name:'山口県',core:'山口',x:70,y:527},
    {code:'36',name:'徳島県',core:'徳島',x:117,y:532},
    {code:'37',name:'香川県',core:'香川',x:109,y:520},
    {code:'38',name:'愛媛県',core:'愛媛',x:90,y:542},
    {code:'39',name:'高知県',core:'高知',x:101,y:554},
    {code:'40',name:'福岡県',core:'福岡',x:54,y:553},
    {code:'41',name:'佐賀県',core:'佐賀',x:52,y:568},
    {code:'42',name:'長崎県',core:'長崎',x:46,y:590},
    {code:'43',name:'熊本県',core:'熊本',x:59,y:588},
    {code:'44',name:'大分県',core:'大分',x:72,y:568},
    {code:'45',name:'宮崎県',core:'宮崎',x:69,y:626},
    {code:'46',name:'鹿児島県',core:'鹿児島',x:56,y:641},
    {code:'47',name:'沖縄県',core:'沖縄',x:60,y:730}
  ];

  let state = load();

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return seedData();
  }

  function seedData(){
    const bookId1 = uid();
    const bookId2 = uid();
    return {
      books:[
        {id:bookId1, name:'關西社寺巡禮', tag:'神社・寺院', color:BOOK_COLORS[1]},
        {id:bookId2, name:'東京近郊', tag:'旅程', color:BOOK_COLORS[3]}
      ],
      records:[
        {id:uid(), bookId:bookId1, name:'伏見稻荷大社', date:'2025-11-03', price:500, location:'京都府', tags:['直書き','限定'], notes:'千本鳥居走完約需 2 小時，清晨參拜人少。', photo:null},
        {id:uid(), bookId:bookId1, name:'清水寺', date:'2025-11-04', price:400, location:'京都府', tags:['書き置き'], notes:'', photo:null},
        {id:uid(), bookId:bookId2, name:'明治神宮', date:'2025-06-12', price:500, location:'東京都', tags:['直書き'], notes:'代代木公園旁，樹林參道很舒服。', photo:null}
      ],
      activeBookId:'all',
      view:'grid'
    };
  }

  function save(){
    try{
      const slim = {
        ...state,
        books: state.books.map(b=>{ const {photo, ...rest} = b; return {...rest, hasPhoto: !!b.photo}; }),
        records: state.records.map(r=>{ const {photo, ...rest} = r; return {...rest, hasPhoto: !!r.photo}; })
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(slim));
      return true;
    }catch(e){
      showToast('儲存空間已滿，這筆資料可能無法永久保存（建議刪除舊照片或匯出備份）');
      return false;
    }
  }
  function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }

  // ---------- Photo storage (IndexedDB — much larger quota than localStorage) ----------
  const IDB_NAME = 'goshuin-photos-db';
  const IDB_STORE = 'photos';
  let idbPromise = null;
  function openPhotoDB(){
    if(idbPromise) return idbPromise;
    idbPromise = new Promise((resolve, reject)=>{
      if(!window.indexedDB){ reject(new Error('indexedDB unsupported')); return; }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
    return idbPromise;
  }
  async function idbSetPhoto(key, dataUrl){
    let db;
    try{ db = await openPhotoDB(); }
    catch(e){ return {ok:false, error:e}; }
    return new Promise((resolve)=>{
      try{
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(dataUrl, key);
        tx.oncomplete = ()=> resolve({ok:true});
        tx.onerror = ()=> resolve({ok:false, error: tx.error});
        tx.onabort = ()=> resolve({ok:false, error: tx.error});
      }catch(e){ resolve({ok:false, error:e}); }
    });
  }
  async function idbGetPhoto(key){
    let db;
    try{ db = await openPhotoDB(); }
    catch(e){ return null; }
    return new Promise((resolve)=>{
      try{
        const tx = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = ()=> resolve(req.result || null);
        req.onerror = ()=> resolve(null);
      }catch(e){ resolve(null); }
    });
  }
  async function idbDeletePhoto(key){
    let db;
    try{ db = await openPhotoDB(); }
    catch(e){ return false; }
    return new Promise((resolve)=>{
      try{
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).delete(key);
        tx.oncomplete = ()=> resolve(true);
        tx.onerror = ()=> resolve(false);
        tx.onabort = ()=> resolve(false);
      }catch(e){ resolve(false); }
    });
  }
  function recPhotoKey(id){ return 'rec:'+id; }
  function bookPhotoKey(id){ return 'book:'+id; }

  // Hydrate in-memory .photo fields from IndexedDB (and migrate any legacy
  // inline base64 photos from older versions of this app into IndexedDB).
  let photosReady = false;
  const photosReadyPromise = (async ()=>{
    await Promise.resolve(); // ensure this always defers past the synchronous script body, even when there's nothing to hydrate
    let needsResave = false;
    for(const b of state.books){
      if(b.photo && typeof b.photo === 'string' && b.photo.startsWith('data:')){
        // legacy inline photo — migrate to IndexedDB
        await idbSetPhoto(bookPhotoKey(b.id), b.photo);
        needsResave = true;
      } else if(b.hasPhoto){
        b.photo = await idbGetPhoto(bookPhotoKey(b.id));
      }
    }
    for(const r of state.records){
      if(r.photo && typeof r.photo === 'string' && r.photo.startsWith('data:')){
        await idbSetPhoto(recPhotoKey(r.id), r.photo);
        needsResave = true;
      } else if(r.hasPhoto){
        r.photo = await idbGetPhoto(recPhotoKey(r.id));
      }
    }
    photosReady = true;
    if(needsResave) save();
    render();
  })();

  function compressImage(dataUrl, maxDim, quality){
    return new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        const isLandscape = w > h;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve({dataUrl: canvas.toDataURL('image/jpeg', quality), isLandscape});
      };
      img.onerror = ()=> resolve({dataUrl, isLandscape:false});
      img.src = dataUrl;
    });
  }

  // ---------- DOM refs ----------
  const $ = id => document.getElementById(id);
  const statsRow = $('statsRow');
  const booksRow = $('booksRow');
  const recordsContainer = $('recordsContainer');
  const searchInput = $('searchInput');
  const bookFilter = $('bookFilter');
  const sortSelect = $('sortSelect');
  const filterCountLabel = $('filterCountLabel');

  let editingBookId = null;
  let editingRecordId = null;
  let pendingPhoto = null;
  let pendingPhotoLandscape = false;
  let pendingBookPhoto = null;
  let selectedBookColor = BOOK_COLORS[0];
  let selectedTags = [];

  // ---------- Render ----------
  function render(){
    renderStats();
    renderBooks();
    renderBookSelects();
    renderRecords();
    paintMap();
  }

  function matchPrefecture(locationText){
    if(!locationText) return null;
    const t = locationText.trim();
    if(!t) return null;
    for(const p of PREFECTURES){
      if(t.includes(p.name) || t.includes(p.core)) return p;
    }
    return null;
  }

  function getVisitedPrefCodes(){
    const set = new Set();
    state.records.forEach(r=>{
      if(r.proxyWritten) return;
      const p = matchPrefecture(r.location);
      if(p) set.add(p.code);
    });
    return set;
  }

  let selectedPrefCode = null;
  let mapInitialized = false;
  let mapMode = 'tile'; // 'tile' (guaranteed fallback) or 'real' (actual geography, loaded async)

  function initMap(){
    if(mapInitialized) return;
    mapInitialized = true;
    renderTileMap();
    paintMap();
    loadRealMap();
  }

  async function loadRealMap(){
    try{
      const [topoRes, topojsonMod] = await Promise.all([
        fetch('https://cdn.jsdelivr.net/gh/dataofjapan/land@master/japan.topojson'),
        import('https://cdn.jsdelivr.net/npm/topojson-client@3/+esm')
      ]);
      if(!topoRes.ok) throw new Error('fetch failed: ' + topoRes.status);
      const topology = await topoRes.json();
      const objectKey = Object.keys(topology.objects)[0];
      const geojson = topojsonMod.feature(topology, topology.objects[objectKey]);
      const ok = renderRealMap(geojson);
      if(!ok) throw new Error('render produced no shapes');
      mapMode = 'real';
      $('mapCredit').innerHTML = `地圖資料：<a href="https://github.com/dataofjapan/land" target="_blank" rel="noopener">地球地図日本 / dataofjapan</a>`;
      paintMap();
    }catch(e){
      // real map failed to load or render — silently keep the reliable tile map
      mapMode = 'tile';
    }
  }

  function renderRealMap(geojson){
    const container = $('japanMap');
    const features = geojson.features || [];
    if(features.length === 0) return false;

    // simple equirectangular-ish projection sized to Japan's lat/lng extent,
    // with longitude scaled by cos(mean latitude) to avoid east-west stretching
    let minLng=Infinity, maxLng=-Infinity, minLat=Infinity, maxLat=-Infinity;
    function scanCoords(coords, depth){
      if(depth === 0){
        const [lng,lat] = coords;
        if(lng<minLng) minLng=lng; if(lng>maxLng) maxLng=lng;
        if(lat<minLat) minLat=lat; if(lat>maxLat) maxLat=lat;
      } else {
        coords.forEach(c => scanCoords(c, depth-1));
      }
    }
    features.forEach(f=>{
      const depth = f.geometry.type === 'MultiPolygon' ? 3 : 2;
      scanCoords(f.geometry.coordinates, depth);
    });

    const meanLat = (minLat+maxLat)/2 * Math.PI/180;
    const rawScale = 300 / ((maxLng-minLng) * Math.cos(meanLat));
    function project([lng,lat]){
      const x = (lng-minLng) * Math.cos(meanLat) * rawScale;
      const y = (maxLat-lat) * rawScale;
      return [x,y];
    }

    // project every feature into raw polygon-of-rings-of-[x,y] arrays first,
    // so Hokkaido/Okinawa can be repositioned before we compute the final viewBox
    const projected = features.map(f=>{
      const props = f.properties || {};
      const idNum = props.id;
      if(idNum == null) return null;
      const code = String(idNum).padStart(2,'0');
      let polys; // array of polygons, each an array of rings, each an array of [x,y]
      if(f.geometry.type === 'Polygon'){
        polys = [f.geometry.coordinates.map(ring => ring.map(project))];
      } else if(f.geometry.type === 'MultiPolygon'){
        polys = f.geometry.coordinates.map(poly => poly.map(ring => ring.map(project)));
      } else return null;
      return { code, name: props.nam_ja||'', polys };
    }).filter(Boolean);

    // Some prefectures (notably Tokyo, which administers the Izu and
    // Ogasawara Islands hundreds of km out in the Pacific) include tiny
    // remote exclaves that would otherwise blow out the map's bounding box.
    // Keep only polygon parts reasonably close to each feature's main landmass.
    function polyArea(ring){
      let a = 0;
      for(let i=0;i<ring.length;i++){
        const [x1,y1] = ring[i], [x2,y2] = ring[(i+1)%ring.length];
        a += x1*y2 - x2*y1;
      }
      return Math.abs(a/2);
    }
    function polyBounds(poly){
      let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
      poly.forEach(ring => ring.forEach(([x,y])=>{
        if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
      }));
      return {cx:(x0+x1)/2, cy:(y0+y1)/2, diag:Math.hypot(x1-x0,y1-y0)};
    }
    // Nagasaki, Kagoshima and Okinawa are genuinely made up of many
    // scattered islands spread across real distances — that's normal for
    // them, unlike Tokyo's Ogasawara exclave. Skip the exclave filter there
    // so we don't strip out islands that are actually part of the prefecture.
    const EXCLAVE_FILTER_EXEMPT = ['42','46','47'];
    projected.forEach(it=>{
      if(it.polys.length <= 1) return;
      if(EXCLAVE_FILTER_EXEMPT.includes(it.code)) return;
      const areas = it.polys.map(poly => poly.reduce((s,ring)=> s+polyArea(ring), 0));
      const mainIdx = areas.indexOf(Math.max(...areas));
      const mainBounds = polyBounds(it.polys[mainIdx]);
      const threshold = Math.max(mainBounds.diag * 8, 15);
      it.polys = it.polys.filter((poly,i)=>{
        if(i === mainIdx) return true;
        const b = polyBounds(poly);
        return Math.hypot(b.cx-mainBounds.cx, b.cy-mainBounds.cy) <= threshold;
      });
    });

    function bboxOf(items){
      let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
      items.forEach(it => it.polys.forEach(poly => poly.forEach(ring => ring.forEach(([x,y])=>{
        if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
      }))));
      return {x0,x1,y0,y1,w:x1-x0,h:y1-y0};
    }
    function transformItems(items, fn){
      items.forEach(it => it.polys.forEach(poly => poly.forEach(ring => {
        for(let i=0;i<ring.length;i++) ring[i] = fn(ring[i]);
      })));
    }

    // Hokkaido is left at its real projected position (part of "mainland") —
    // the actual geographic gap to Tohoku isn't dramatic at this scale, so no
    // artificial repositioning is needed and it avoids alignment bugs entirely.
    const mainland = projected.filter(it => it.code!=='47');
    const okinawa = projected.filter(it => it.code==='47');
    const mBox = bboxOf(mainland);

    // Okinawa is placed as a clearly separate inset box, bottom-right corner —
    // not geographically positioned, matching how most Japan reference maps
    // show it (too far from the mainland to place accurately at this scale).
    let okinawaInsetBox = null;
    if(okinawa.length){
      const oBox = bboxOf(okinawa);
      // scaled up well beyond true relative size — insets are explicitly
      // "not to scale" (see divider line) and Okinawa's real land area is
      // tiny, so a literal-scale rendering is nearly invisible at map size
      const s = 1.3;
      const insetW = oBox.w*s, insetH = oBox.h*s;
      const margin = 2;
      const targetX1 = mBox.x1;
      const targetY1 = mBox.y1 + insetH*0.12 + 4;
      transformItems(okinawa, ([x,y]) => [
        targetX1 - (oBox.x1-x)*s,
        targetY1 - (oBox.y1-y)*s
      ]);
      okinawaInsetBox = {
        x0: targetX1 - insetW - margin, y0: targetY1 - insetH - margin,
        x1: targetX1 + margin, y1: targetY1 + margin
      };
    }

    // ---- region name labels ----
    // Two placement modes:
    //  - "anchor": pinned relative to one specific prefecture (as requested),
    //    e.g. chubu sits directly above Toyama
    //  - "auto": median-centroid based, for regions where that already reads fine
    const REGION_LABEL_DEFS = [
      {slug:'hokkaido', text:'北海道地方', mode:'auto'},
      {slug:'tohoku', text:'東北地方', mode:'auto', extraMargin:4},
      {slug:'kanto', text:'関東地方', mode:'auto'},
      {slug:'chubu', text:'中部地方', mode:'anchor', anchorCode:'16', dir:'up', dy:-5},   // 富山 toyama
      {slug:'kansai', text:'近畿地方', mode:'anchor', anchorCode:'30', dir:'down', dx:6}, // 和歌山 wakayama
      {slug:'chugoku', text:'中国地方', mode:'anchor', anchorCode:'32', dir:'up'},  // 島根 shimane
      {slug:'shikoku', text:'四国地方', mode:'anchor', anchorCode:'39', dir:'down', dx:6},// 高知 kochi
      {slug:'kyushu', text:'九州地方', mode:'anchor', anchorCode:'45', dir:'downright'},// 宮崎 miyazaki
      {slug:'okinawa', text:'沖縄地方', mode:'auto'}
    ];
    const LABEL_FONT_SIZE = 5.5;
    function median(nums){
      const s = nums.slice().sort((a,b)=>a-b);
      const mid = Math.floor(s.length/2);
      return s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
    }
    function prefCentroid(it){
      const b = bboxOf([it]);
      return [(b.x0+b.x1)/2, (b.y0+b.y1)/2];
    }
    // for UI anchor points (selection label/pin) we want the dominant
    // mainland landmass specifically — not a bbox center across every part,
    // which remote-but-real islands (Izu/Ogasawara for Tokyo, Amami for
    // Kagoshima) would drag away from where the prefecture actually reads
    // visually on the map
    function mainlandCentroid(it){
      if(it.polys.length <= 1) return prefCentroid(it);
      let bestPoly = it.polys[0], bestArea = -1;
      it.polys.forEach(poly=>{
        const area = poly.reduce((s,ring)=> s+polyArea(ring), 0);
        if(area > bestArea){ bestArea = area; bestPoly = poly; }
      });
      const b = polyBounds(bestPoly);
      return [b.cx, b.cy];
    }
    const mapMidX = mBox.x0 + mBox.w/2;
    const regionLabels = [];
    REGION_LABEL_DEFS.forEach(({slug,text,mode,anchorCode,dir,extraMargin,dx,dy})=>{
      const members = projected.filter(it => REGION_OF_CODE[it.code]===slug);
      if(members.length===0) return;
      const textWidth = text.length * LABEL_FONT_SIZE * 1.05;
      const color = REGION_COLORS[slug];
      const ox = dx||0, oy = dy||0;

      if(mode === 'anchor'){
        const anchorItem = projected.find(it => it.code===anchorCode);
        if(!anchorItem){ return; }
        const [acx, acy] = prefCentroid(anchorItem);
        const gap = 4;
        if(dir==='up' || dir==='down'){
          regionLabels.push({
            text, color,
            x: acx+ox, y: (dir==='up' ? acy-gap-LABEL_FONT_SIZE : acy+gap+LABEL_FONT_SIZE)+oy,
            anchor: 'middle', onRight: acx>=mapMidX, textWidth, fixed:true
          });
        } else if(dir==='downright' || dir==='downleft' || dir==='upright' || dir==='upleft'){
          const goRight = dir.endsWith('right');
          const goDown = dir.startsWith('down');
          regionLabels.push({
            text, color,
            x: (goRight ? acx+gap : acx-gap)+ox,
            y: (goDown ? acy+gap+LABEL_FONT_SIZE : acy-gap-LABEL_FONT_SIZE)+oy,
            anchor: goRight ? 'start' : 'end',
            onRight: goRight, textWidth, fixed:true
          });
        } else {
          regionLabels.push({
            text, color,
            x: (dir==='right' ? acx+gap : acx-gap)+ox,
            y: acy+oy,
            anchor: dir==='right' ? 'start' : 'end',
            onRight: dir==='right', textWidth, fixed:true
          });
        }
        return;
      }

      // auto mode: median-centroid based
      const centroids = members.map(prefCentroid);
      const cx = median(centroids.map(c=>c[0]));
      const cy = median(centroids.map(c=>c[1]));
      const onRight = cx >= mapMidX;
      const margin = 12 + (extraMargin||0);
      regionLabels.push({
        text, color,
        x: onRight ? cx+margin : cx-margin,
        y: cy,
        anchor: onRight ? 'start' : 'end',
        onRight, textWidth, fixed:false
      });
    });
    // simple vertical collision avoidance within each side (left/right) —
    // only applied to "auto" labels, since "anchor" labels are intentionally
    // pinned to a specific spot and shouldn't be pushed around
    const minLineGap = LABEL_FONT_SIZE * 3.2;
    ['left','right'].forEach(side=>{
      const group = regionLabels.filter(l => !l.fixed && (side==='right') === l.onRight).sort((a,b)=>a.y-b.y);
      for(let i=1;i<group.length;i++){
        if(group[i].y - group[i-1].y < minLineGap){
          group[i].y = group[i-1].y + minLineGap;
        }
      }
    });

    const finalBox = bboxOf(projected);
    // expand the viewBox to fully contain every label's estimated extent,
    // so labels for edge regions never get clipped off the visible area
    let labelMinX = finalBox.x0, labelMaxX = finalBox.x1;
    let labelMinY = finalBox.y0, labelMaxY = finalBox.y1;
    regionLabels.forEach(lb=>{
      let left, right;
      if(lb.anchor === 'middle'){
        left = lb.x - lb.textWidth/2;
        right = lb.x + lb.textWidth/2;
      } else {
        left = lb.onRight ? lb.x : lb.x - lb.textWidth;
        right = lb.onRight ? lb.x + lb.textWidth : lb.x;
      }
      if(left < labelMinX) labelMinX = left;
      if(right > labelMaxX) labelMaxX = right;
      if(lb.y - LABEL_FONT_SIZE < labelMinY) labelMinY = lb.y - LABEL_FONT_SIZE;
      if(lb.y + LABEL_FONT_SIZE > labelMaxY) labelMaxY = lb.y + LABEL_FONT_SIZE;
    });
    const pad = 4;
    const vbX = labelMinX-pad, vbY = labelMinY-pad;
    const vbW = (labelMaxX-labelMinX)+pad*2, vbH = (labelMaxY-labelMinY)+pad*2;

    function ringToPath(ring){
      return ring.map((pt,i)=> (i===0?'M':'L') + pt[0].toFixed(1) + ',' + pt[1].toFixed(1)).join(' ') + 'Z';
    }
    function polysToPath(polys){
      return polys.map(poly => poly.map(ringToPath).join(' ')).join(' ');
    }

    let markup = `<svg viewBox="${vbX.toFixed(1)} ${vbY.toFixed(1)} ${vbW.toFixed(1)} ${vbH.toFixed(1)}" xmlns="http://www.w3.org/2000/svg">`;
    let shapeCount = 0;
    projected.forEach(it=>{
      const d = polysToPath(it.polys);
      if(!d) return;
      shapeCount++;
      const c = mainlandCentroid(it);
      markup += `<path class="pref-shape" data-code="${it.code}" data-name="${it.name}" data-cx="${c[0].toFixed(1)}" data-cy="${c[1].toFixed(1)}" d="${d}" fill="var(--washi-deep)" fill-opacity="0.6" stroke="var(--washi)" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round" fill-rule="nonzero"><title>${it.name}</title></path>`;
    });
    if(okinawaInsetBox){
      const b = okinawaInsetBox;
      // diagonal divider marking Okinawa as a separate, not-to-scale inset
      markup += `<line x1="${(b.x0-6).toFixed(1)}" y1="${(b.y0-2).toFixed(1)}" x2="${(b.x0+6).toFixed(1)}" y2="${(b.y0-14).toFixed(1)}" class="inset-divider"/>`;
      markup += `<rect x="${b.x0.toFixed(1)}" y="${b.y0.toFixed(1)}" width="${(b.x1-b.x0).toFixed(1)}" height="${(b.y1-b.y0).toFixed(1)}" class="inset-frame"/>`;
    }
    regionLabels.forEach(lb=>{
      markup += `<text x="${lb.x.toFixed(1)}" y="${lb.y.toFixed(1)}" text-anchor="${lb.anchor}" class="region-label" fill="${lb.color}" dominant-baseline="middle">${lb.text}</text>`;
    });
    markup += `<g id="selectedPrefLabelGroup" style="display:none;">
      <path id="selectedPrefPin" class="selected-pref-pin"/>
      <rect id="selectedPrefLabelBg" class="selected-pref-label-bg" rx="1.5"/>
      <text id="selectedPrefLabelText" class="selected-pref-label-text" dominant-baseline="middle"></text>
    </g>`;
    markup += `</svg>`;
    if(shapeCount === 0) return false;
    container.innerHTML = markup;
    container.querySelectorAll('.pref-shape').forEach(el=>{
      el.addEventListener('click', ()=>{
        const code = el.getAttribute('data-code');
        selectedPrefCode = (selectedPrefCode===code) ? null : code;
        paintMap();
        renderMapSide();
      });
    });
    return true;
  }

  const REGION_OF_CODE = (()=>{
    const defs = [
      ['hokkaido',['01']],
      ['tohoku',['02','03','04','05','06','07']],
      ['kanto',['08','09','10','11','12','13','14']],
      ['chubu',['15','16','17','18','19','20','21','22','23']],
      ['kansai',['24','25','26','27','28','29','30']],
      ['chugoku',['31','32','33','34','35']],
      ['shikoku',['36','37','38','39']],
      ['kyushu',['40','41','42','43','44','45','46']],
      ['okinawa',['47']]
    ];
    const map = {};
    defs.forEach(([slug,codes])=> codes.forEach(c=> map[c]=slug));
    return map;
  })();
  const REGION_COLORS = {
    hokkaido:'#926252', chubu:'#928852', tohoku:'#789252', shikoku:'#529252',
    kanto:'#6d5292', kyushu:'#885292', chugoku:'#925282', kansai:'#925268', okinawa:'#529278'
  };
  // a couple of very small-island prefectures still need extra help staying
  // visible against the background — but Nagasaki/Kumamoto should just match
  // the rest of Kyushu's region color, per feedback
  const PREFECTURE_COLOR_OVERRIDES = {
    '47':'#0f1e17'  // 沖縄 okinawa — near-black
  };
  const PREFECTURE_OPACITY_OVERRIDES = { '47':1 };

  function renderTileMap(){
    const wrap = $('japanMap');
    const CELL = 24, GAP = 3;
    const maxCol = Math.max(...TILE_GRID.map(g=>g.col));
    const maxRow = Math.max(...TILE_GRID.map(g=>g.row));
    const W = (maxCol+1)*CELL + 8;
    const H = (maxRow+1)*CELL + 8;
    let markup = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
    TILE_GRID.forEach(g=>{
      const x = g.col*CELL + 4, y = g.row*CELL + 4;
      const size = CELL - GAP;
      markup += `
        <g class="pref-tile" data-code="${g.code}" transform="translate(${x},${y})">
          <rect class="tile-base" width="${size}" height="${size}" rx="4"/>
          <text class="tile-label" x="${size/2}" y="${size/2}">${g.label}</text>
          <title>${g.name}</title>
        </g>
      `;
    });
    markup += `</svg>`;
    wrap.innerHTML = markup;
    wrap.querySelectorAll('.pref-tile').forEach(el=>{

  function paintMap(){
    const visited = getVisitedPrefCodes();
    $('mapProgress').innerHTML = `已巡禮 <strong>${visited.size}</strong> / 47 都道府県`;

    if(mapMode === 'real'){
      let selectedEl = null;
      $('japanMap').querySelectorAll('.pref-shape').forEach(el=>{
        const code = el.getAttribute('data-code');
        const isVisited = visited.has(code);
        const isSelected = code === selectedPrefCode;
        if(isSelected) selectedEl = el;
        const region = REGION_OF_CODE[code];
        const baseColor = PREFECTURE_COLOR_OVERRIDES[code] || REGION_COLORS[region] || '#8a7f6a';
        const baseOpacity = PREFECTURE_OPACITY_OVERRIDES[code] ?? 0.78;
        el.style.fill = isVisited ? 'var(--shu)' : baseColor;
        el.style.fillOpacity = isVisited ? '1' : String(baseOpacity);
        el.style.stroke = 'var(--washi)';
        el.style.strokeWidth = '0.6';
        // a soft outline "frames" the selected prefecture as a whole silhouette —
        // avoids the jagged look a thick stroke gets on many-island prefectures
        el.style.filter = isSelected
          ? 'drop-shadow(0 0 1.1px var(--sumi)) drop-shadow(0 0 1.1px var(--sumi)) brightness(1.15)'
          : 'none';
      });

      // show the selected prefecture's name in a small floating label beside it
      const svg = $('japanMap').querySelector('svg');
      const labelGroup = $('selectedPrefLabelGroup');
      if(selectedEl && svg && labelGroup){
        const name = selectedEl.getAttribute('data-name');
        const cx = parseFloat(selectedEl.getAttribute('data-cx'));
        const cy = parseFloat(selectedEl.getAttribute('data-cy'));
        const vb = svg.viewBox.baseVal;
        const fontSize = 6, padX = 2.4, padY = 1.8;
        const textEl = $('selectedPrefLabelText');
        const bgEl = $('selectedPrefLabelBg');
        const pinEl = $('selectedPrefPin');
        textEl.textContent = name;
        const estWidth = name.length * fontSize * 1.05;
        const boxW = estWidth + padX*2, boxH = fontSize + padY*2;
        const gap = 3;
        // pick whichever side actually fits inside the viewBox — prefecture
        // near either edge (Nagasaki/Kagoshima in the west, etc.) would
        // otherwise get its label clipped off-canvas
        const rightX = cx + gap, leftX = cx - gap - boxW;
        const fitsRight = rightX + boxW <= vb.x + vb.width;
        const fitsLeft = leftX >= vb.x;
        const preferRight = cx >= vb.x + vb.width/2;
        let boxX;
        if(preferRight && fitsRight) boxX = rightX;
        else if(!preferRight && fitsLeft) boxX = leftX;
        else if(fitsRight) boxX = rightX;
        else if(fitsLeft) boxX = leftX;
        else boxX = Math.min(Math.max(cx - boxW/2, vb.x), vb.x + vb.width - boxW);
        let boxY = cy - boxH/2;
        boxY = Math.min(Math.max(boxY, vb.y), vb.y + vb.height - boxH);
        bgEl.setAttribute('x', boxX.toFixed(1));
        bgEl.setAttribute('y', boxY.toFixed(1));
        bgEl.setAttribute('width', boxW.toFixed(1));
        bgEl.setAttribute('height', boxH.toFixed(1));
        textEl.setAttribute('x', (boxX+padX).toFixed(1));
        textEl.setAttribute('y', (boxY+boxH/2).toFixed(1));
        // a small pin marker drops straight onto the prefecture's centroid,
        // so it's easy to spot exactly which shape is selected even in a
        // dense, closely-packed cluster
        const pinR = 1.6, topY = cy - pinR*3.4;
        const pinD = `M${cx.toFixed(1)},${cy.toFixed(1)} L${(cx-pinR).toFixed(1)},${(topY+pinR).toFixed(1)} A${pinR},${pinR} 0 1,1 ${(cx+pinR).toFixed(1)},${(topY+pinR).toFixed(1)} Z`;
        pinEl.setAttribute('d', pinD);
        labelGroup.style.display = '';
      } else if(labelGroup){
        labelGroup.style.display = 'none';
      }

      renderMapSide();
      return;
    }

    $('japanMap').querySelectorAll('.pref-tile').forEach(el=>{
      const code = el.getAttribute('data-code');
      const isVisited = visited.has(code);
      const isSelected = code === selectedPrefCode;
      const region = REGION_OF_CODE[code];
      const rect = el.querySelector('.tile-base');
      rect.style.fill = isVisited ? 'var(--shu)' : REGION_COLORS[region];
      rect.style.fillOpacity = isVisited ? '1' : '0.55';
      el.classList.toggle('selected', isSelected);
      const label = el.querySelector('.tile-label');
      label.style.fill = isVisited ? '#faf3e4' : '#2b2622';
    });
    renderMapSide();
  }

  function renderMapSide(){
    const side = $('mapSide');
    if(!selectedPrefCode){
      side.innerHTML = `<div class="map-side-empty">點選地圖上的朱紅印記，查看該地的參拜記錄。</div>`;
      return;
    }
    const pref = PREFECTURES.find(p=>p.code===selectedPrefCode);
    const list = state.records.filter(r=>{
      const m = matchPrefecture(r.location);
      return m && m.code===selectedPrefCode;
    });

    if(list.length===0){
      side.innerHTML = `
        <div class="map-side-title">${pref.name}</div>
        <div class="map-side-count">尚未在此地留下御朱印記錄</div>
      `;
      return;
    }

    // group by shrine/temple name — same name shown once, with latest date + visit count
    const groups = new Map();
    list.forEach(r=>{
      const key = (r.name||'（未命名）').trim();
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    });
    const groupList = Array.from(groups.entries()).map(([name, records])=>{
      const sorted = records.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||''));
      return { name, latest: sorted[0], count: records.length, records };
    }).sort((a,b)=> (b.latest.date||'').localeCompare(a.latest.date||''));

    side.innerHTML = `
      <div class="map-side-title">${pref.name}</div>
      <div class="map-side-count">共 ${list.length} 枚御朱印・${groupList.length} 間社寺</div>
      <div class="map-side-list" id="mapSideList"></div>

        <div class="msi-thumb">${g.latest.photo ? `<img src="${g.latest.photo}" alt="">` : `<span class="msi-thumb-mark">朱</span>`}</div>

  // ---------- Long-press gesture (touch + mouse) ----------
  function attachLongPress(el, callback, duration=550){
    let timer = null;
    let startX = 0, startY = 0;
    const clear = ()=>{ if(timer){ clearTimeout(timer); timer=null; } };
    el.addEventListener('pointerdown', (e)=>{
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      startX = e.clientX; startY = e.clientY;
      el._longPressFired = false;
      timer = setTimeout(()=>{
        el._longPressFired = true;
        clear();
        if(navigator.vibrate) navigator.vibrate(15);
        callback(e);
      }, duration);
    });
    el.addEventListener('pointermove', (e)=>{
      if(timer && (Math.abs(e.clientX-startX)>10 || Math.abs(e.clientY-startY)>10)) clear();
    });
    el.addEventListener('pointerup', clear);
    el.addEventListener('pointercancel', clear);
    el.addEventListener('pointerleave', clear);
    el.addEventListener('contextmenu', (e)=> e.preventDefault());
  }

  async function deleteBook(bookId){
    if(!bookId) return;
    const hasRecords = state.records.some(r=>r.bookId===bookId);
    if(hasRecords && !confirm('此朱印帳內仍有御朱印記錄，刪除後這些記錄也會一併刪除，確定嗎？')) return false;
    if(!hasRecords && !confirm('確定要刪除這本朱印帳嗎？')) return false;
    const orphanRecords = state.records.filter(r=>r.bookId===bookId);
    await Promise.all(orphanRecords.map(r=> idbDeletePhoto(recPhotoKey(r.id))));
    await idbDeletePhoto(bookPhotoKey(bookId));
    state.records = state.records.filter(r=>r.bookId!==bookId);
    state.books = state.books.filter(b=>b.id!==bookId);
    if(state.activeBookId===bookId) state.activeBookId='all';
    save(); render();
    showToast('已刪除朱印帳');
    return true;
  }

  // ---------- Reiwa era date helpers ----------
  const REIWA_OFFSET = 2018; // Reiwa Y = Gregorian year - 2018 (Reiwa 1 = 2019)

  function gregorianYearToReiwa(y){ return y - REIWA_OFFSET; }
  function reiwaYearToGregorian(r){ return r + REIWA_OFFSET; }

  function daysInMonth(gYear, month){
    return new Date(gYear, month, 0).getDate();
  }

  function populateMonthDaySelects(){
    const monthSel = $('recMonth');
    if(monthSel.options.length===0){
      for(let m=1;m<=12;m++){
        const opt = document.createElement('option');
        opt.value = m; opt.textContent = m;
        monthSel.appendChild(opt);
      }
    }
    refreshDayOptions();
  }

  function refreshDayOptions(){
    const daySel = $('recDay');
    const eraYear = parseInt($('recEraYear').value, 10);
    const month = parseInt($('recMonth').value, 10) || 1;
    const gYear = eraYear ? reiwaYearToGregorian(eraYear) : new Date().getFullYear();
    const maxDay = daysInMonth(gYear, month);
    const prevValue = parseInt(daySel.value, 10) || 0;
    daySel.innerHTML = '';
    for(let d=1; d<=maxDay; d++){
      const opt = document.createElement('option');
      opt.value = d; opt.textContent = d;
      daySel.appendChild(opt);
    }
    daySel.value = Math.min(prevValue || 1, maxDay);
  }

  function updateWesternHint(){

  // ---------- Photo Crop Tool ----------
  let cropResolver = null;
  let cropBoxState = null;

  function initCropBox(){
    const img = $('cropImage');
    const dispW = img.offsetWidth, dispH = img.offsetHeight;
    const marginX = dispW * 0.08, marginY = dispH * 0.08;
    cropBoxState = {
      x: marginX, y: marginY,
      w: dispW - marginX*2, h: dispH - marginY*2,
      dispW, dispH
    };
    applyCropBoxStyle();
  }
  function applyCropBoxStyle(){
    const box = $('cropBox');
    box.style.left = cropBoxState.x + 'px';
    box.style.top = cropBoxState.y + 'px';
    box.style.width = cropBoxState.w + 'px';
    box.style.height = cropBoxState.h + 'px';
  }

  function openCropTool(dataUrl){
    return new Promise((resolve)=>{
      cropResolver = resolve;
      const img = $('cropImage');
      const onLoad = ()=>{
        img.removeEventListener('load', onLoad);
        requestAnimationFrame(()=> requestAnimationFrame(initCropBox));
      };
      img.addEventListener('load', onLoad);
      img.src = dataUrl;
      $('cropOverlay').classList.add('show');
    });
  }
  function closeCropTool(result){
    $('cropOverlay').classList.remove('show');
    const resolve = cropResolver;
    cropResolver = null;
    if(resolve) resolve(result);
  }

  $('cropCancelBtn').addEventListener('click', ()=> closeCropTool(null));
  $('cropCancelX').addEventListener('click', ()=> closeCropTool(null));
  $('cropConfirmBtn').addEventListener('click', ()=>{
    const img = $('cropImage');
    const scaleX = img.naturalWidth / cropBoxState.dispW;
    const scaleY = img.naturalHeight / cropBoxState.dispH;
    const sx = cropBoxState.x * scaleX;
    const sy = cropBoxState.y * scaleY;
    const sw = cropBoxState.w * scaleX;
    const sh = cropBoxState.h * scaleY;
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(sw));
    canvas.height = Math.max(1, Math.round(sh));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    closeCropTool(canvas.toDataURL('image/jpeg', 0.92));
  });

  (function setupCropDrag(){
    const stage = $('cropStage');
    const box = $('cropBox');
    let dragMode = null, startPt = null, startBox = null;

    function pointFromEvent(e){
      const rect = stage.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }
    function onDown(mode){
      return (e)=>{
        e.preventDefault();
        e.stopPropagation();
        dragMode = mode;
        startPt = pointFromEvent(e);
        startBox = Object.assign({}, cropBoxState);
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      };
    }
    function onMove(e){
      if(!dragMode || !cropBoxState) return;
      const p = pointFromEvent(e);
      const dx = p.x - startPt.x, dy = p.y - startPt.y;
      const dispW = cropBoxState.dispW, dispH = cropBoxState.dispH;
      const minSize = 30;
      let {x,y,w,h} = startBox;
      if(dragMode === 'move'){
        x = Math.min(Math.max(startBox.x+dx, 0), dispW - w);
        y = Math.min(Math.max(startBox.y+dy, 0), dispH - h);
      } else {
        let nx=x, ny=y, nw=w, nh=h;
        if(dragMode.includes('n')){ ny = startBox.y+dy; nh = startBox.h-dy; }
        if(dragMode.includes('s')){ nh = startBox.h+dy; }
        if(dragMode.includes('w')){ nx = startBox.x+dx; nw = startBox.w-dx; }
        if(dragMode.includes('e')){ nw = startBox.w+dx; }
        if(nw < minSize){ if(dragMode.includes('w')) nx = startBox.x+startBox.w-minSize; nw = minSize; }
        if(nh < minSize){ if(dragMode.includes('n')) ny = startBox.y+startBox.h-minSize; nh = minSize; }
        nx = Math.max(0, nx); ny = Math.max(0, ny);
        if(nx+nw > dispW) nw = dispW-nx;
        if(ny+nh > dispH) nh = dispH-ny;
        x=nx; y=ny; w=nw; h=nh;
      }
      cropBoxState.x=x; cropBoxState.y=y; cropBoxState.w=w; cropBoxState.h=h;
      applyCropBoxStyle();
    }
    function onUp(){
      dragMode = null;
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    }
    box.addEventListener('pointerdown', (e)=>{
      if(e.target.classList.contains('crop-handle')) return;
      onDown('move')(e);
    });
    box.querySelectorAll('.crop-handle').forEach(h=>{
      h.addEventListener('pointerdown', onDown(h.dataset.handle));
    });
  })();

  // ---------- Share Card ----------
  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  async function drawShareCard(){
    const canvas = $('shareCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    try{ await document.fonts.ready; }catch(e){}

    // ---- background ----
    const bgGrad = ctx.createLinearGradient(0,0,0,H);
    bgGrad.addColorStop(0, '#f0ede3');
    bgGrad.addColorStop(1, '#ecdfc2');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0,0,W,H);

    // subtle border frame
    ctx.strokeStyle = 'rgba(44,74,110,0.25)';
    ctx.lineWidth = 3;
    ctx.strokeRect(28,28,W-56,H-56);

    const shrineCount = new Set(state.records.filter(r=>!r.proxyWritten).map(r=>(r.name||'').trim()).filter(Boolean)).size;
    const totalGoshuin = state.records.length;
    const bookCount = state.books.length;
    const totalSpent = state.records.reduce((s,r)=> s + (Number(r.price)||0), 0) + state.books.reduce((s,b)=> s + (Number(b.price)||0), 0);
    const visitedCount = getVisitedPrefCodes().size;

    // ---- title ----
    ctx.textAlign = 'center';
    ctx.fillStyle = '#242a2e';
    ctx.font = '700 88px "Shippori Mincho", serif';
    ctx.fillText('神社巡り', W/2, 200);
    ctx.font = '400 30px "Zen Kaku Gothic New", sans-serif';
    ctx.fillStyle = '#1f3650';
    ctx.letterSpacing = '6px';
    ctx.fillText('GOSHUIN COLLECTION', W/2, 250);
    ctx.letterSpacing = '0px';

    // divider
    ctx.strokeStyle = 'rgba(43,38,34,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W/2-160, 290); ctx.lineTo(W/2+160, 290);
    ctx.stroke();

    // ---- decorative Fuji + torii ----
    const cx = W/2, baseY = 470;
    ctx.fillStyle = 'rgba(201,184,150,0.5)';
    ctx.beginPath();
    ctx.moveTo(cx-260, baseY); ctx.quadraticCurveTo(cx-150,baseY-24, cx-40,baseY);
    ctx.quadraticCurveTo(cx+80,baseY-24, cx+260,baseY);
    ctx.lineTo(cx+260,baseY+4); ctx.lineTo(cx-260,baseY+4); ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#2c4a6e';
    ctx.beginPath();
    ctx.moveTo(cx-140, baseY); ctx.lineTo(cx-15, baseY-190); ctx.lineTo(cx+110, baseY); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#f0ede3';
    ctx.beginPath();
    ctx.moveTo(cx-15, baseY-190); ctx.lineTo(cx+20,baseY-140); ctx.lineTo(cx+4,baseY-152);
    ctx.lineTo(cx-10,baseY-128); ctx.lineTo(cx-28,baseY-142); ctx.lineTo(cx-45,baseY-118); ctx.closePath();
    ctx.fill();

    // torii
    ctx.strokeStyle = '#2c4a6e';
    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx+150,baseY-110); ctx.lineTo(cx+140,baseY);
    ctx.moveTo(cx+270,baseY-110); ctx.lineTo(cx+282,baseY);
    ctx.moveTo(cx+130,baseY-110); ctx.lineTo(cx+292,baseY-110);
    ctx.moveTo(cx+118,baseY-88); ctx.lineTo(cx+304,baseY-88);
    ctx.stroke();

    // ---- stats grid ----
    const statsY = 620;
    const stats = [
      {label:'御朱印總數', value:totalGoshuin, unit:'枚'},
      {label:'朱印帳數量', value:bookCount, unit:'本'},
      {label:'參拜神社/寺廟', value:shrineCount, unit:'間'},
      {label:'累計奉納金', value:'¥'+totalSpent.toLocaleString(), unit:''}
    ];
    const colW = (W-160)/2, rowH = 190;
    stats.forEach((s,i)=>{
      const col = i%2, row = Math.floor(i/2);
      const x = 80 + col*colW, y = statsY + row*rowH;
      roundRect(ctx, x, y, colW-24, rowH-24, 10);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(43,38,34,0.12)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.textAlign = 'left';
      ctx.fillStyle = '#5a5f57';
      ctx.font = '400 24px "Zen Kaku Gothic New", sans-serif';
      ctx.fillText(s.label, x+28, y+52);
      ctx.fillStyle = '#1f3650';
      ctx.font = '700 58px "Shippori Mincho", serif';
      ctx.fillText(String(s.value), x+28, y+118);
      if(s.unit){
        const numW = ctx.measureText(String(s.value)).width;
        ctx.font = '400 26px "Zen Kaku Gothic New", sans-serif';
        ctx.fillStyle = '#8a8f80';
        ctx.fillText(s.unit, x+28+numW+8, y+118);
      }
    });

    // ---- pilgrimage progress ----
    const progY = statsY + rowH*2 + 30;
    roundRect(ctx, 80, progY, W-160, 130, 10);
    ctx.fillStyle = 'rgba(44,74,110,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(44,74,110,0.25)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#242a2e';
    ctx.font = '400 28px "Zen Kaku Gothic New", sans-serif';
    ctx.fillText('已巡禮都道府県', W/2, progY+48);
    ctx.font = '700 56px "Shippori Mincho", serif';
    ctx.fillStyle = '#1f3650';
    ctx.fillText(`${visitedCount} / 47`, W/2, progY+104);

    // progress bar
    const barY = progY+150;
    roundRect(ctx, 80, barY, W-160, 14, 7);
    ctx.fillStyle = 'rgba(43,38,34,0.1)';
    ctx.fill();
    const barW = (W-160) * Math.min(visitedCount/47,1);
    if(barW>0){
      roundRect(ctx, 80, barY, barW, 14, 7);
      ctx.fillStyle = '#2c4a6e';
      ctx.fill();
    }

    // ---- footer ----
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8a8f80';
    ctx.font = '400 22px "Zen Kaku Gothic New", sans-serif';
    const today = new Date();
    const dateStr = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
    ctx.fillText(`記錄至 ${dateStr}`, W/2, H-70);
  }

  $('importBtn').addEventListener('click', ()=> $('importInput').click());
  $('importInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      let data;
      try{ data = JSON.parse(reader.result); }
      catch(err){ showToast('備份檔格式錯誤，無法讀取'); e.target.value=''; return; }

      if(!Array.isArray(data.books) || !Array.isArray(data.records)){
        showToast('備份檔格式不正確');
        e.target.value = '';
        return;
      }

      const mode = confirm(
        `讀取到 ${data.books.length} 本朱印帳、${data.records.length} 筆御朱印記錄。\n\n按「確定」＝合併到目前資料（略過重複 ID）\n按「取消」＝完全取代目前所有資料`
      ) ? 'merge' : 'replace';

      showToast('正在匯入照片，資料量較大時請稍候…');

      // persist any imported photos into IndexedDB under their record/book keys,
      // in parallel batches (much faster than one-at-a-time for large photo counts)
      const photoJobs = [];
      data.books.forEach(b=>{
        if(b.photo && typeof b.photo === 'string' && b.photo.startsWith('data:')){
          photoJobs.push({key: bookPhotoKey(b.id), dataUrl: b.photo});
        }
      });
      data.records.forEach(r=>{
        if(r.photo && typeof r.photo === 'string' && r.photo.startsWith('data:')){
          photoJobs.push({key: recPhotoKey(r.id), dataUrl: r.photo});
        }
      });
      const BATCH_SIZE = 40;
      let photoFailCount = 0;
      for(let i=0; i<photoJobs.length; i+=BATCH_SIZE){
        const batch = photoJobs.slice(i, i+BATCH_SIZE);
        const results = await Promise.all(batch.map(job => idbSetPhoto(job.key, job.dataUrl)));
        photoFailCount += results.filter(r=>!r.ok).length;
      }

      if(mode === 'replace'){
        state.books = data.books;
        state.records = data.records;
        if(!state.books.find(b=>b.id===state.activeBookId)) state.activeBookId = 'all';
      } else {
        const existingBookIds = new Set(state.books.map(b=>b.id));
        data.books.forEach(b=>{ if(!existingBookIds.has(b.id)) state.books.push(b); });
        const existingRecordIds = new Set(state.records.map(r=>r.id));
        data.records.forEach(r=>{ if(!existingRecordIds.has(r.id)) state.records.push(r); });
      }

      save(); render();
      const baseMsg = mode==='replace' ? '已還原備份（取代模式）' : '已合併備份資料';
      showToast(photoFailCount > 0 ? `${baseMsg}，但有 ${photoFailCount} 張照片因儲存空間不足未能匯入` : baseMsg);
      e.target.value = '';
    };
    reader.onerror = ()=>{ showToast('讀取檔案失敗'); e.target.value=''; };
    reader.readAsText(file);
  });

  // ---------- Helpers ----------
  function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function formatDate(d){
    if(!d) return '';
    const parts = d.split('-');
    if(parts.length!==3) return d;
    return `${parts[0]}年${parts[1]}月${parts[2]}日`;
  }
  function shade(hex, percent){
    const num = parseInt(hex.replace('#',''),16);
    let r = (num>>16) + Math.round(255*percent/100);
    let g = ((num>>8)&0xff) + Math.round(255*percent/100);
    let b = (num&0xff) + Math.round(255*percent/100);
    r = Math.max(0,Math.min(255,r)); g = Math.max(0,Math.min(255,g)); b = Math.max(0,Math.min(255,b));
    return '#' + (r<<16|g<<8|b).toString(16).padStart(6,'0');
  }
  let toastTimer;
  function showToast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  // init
  $('recLocation').insertAdjacentHTML('beforeend', PREFECTURES.map(p=>`<option value="${p.name}">${p.name}</option>`).join(''));
  $('bookLocation').insertAdjacentHTML('beforeend', PREFECTURES.map(p=>`<option value="${p.name}">${p.name}</option>`).join(''));
  state.view = 'list';
  render();
  initMap();
})();
</script>
</body>
</html>
